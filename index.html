<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homie</title>
  <meta name="description" content="Homie — Manajemen Rumah Tangga: Keuangan, Belanja & Agenda Keluarga">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homie">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <script>
    // Terapkan tema secepat mungkin agar tidak berkedip.
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('mrt_prefs') || '{}');
        var theme = prefs.theme || 'auto';
        if (theme === 'auto') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) { /* abaikan */ }
    })();
  </script>
</head>
<body>
  <div id="top-progress" aria-hidden="true"></div>

  <!-- Layar awal -->
  <div id="splash" class="splash">
    <div class="brand-logo brand-logo-lg"><i class="bi bi-house-heart-fill"></i></div>
    <div class="spinner-border text-primary mt-4" role="status"><span class="visually-hidden">Memuat…</span></div>
    <p class="text-muted mt-3 mb-0" id="splash-text">Menyiapkan aplikasi…</p>
  </div>

  <!-- Login -->
  <section id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-logo brand-logo-lg mx-auto"><i class="bi bi-house-heart-fill"></i></div>
        <h1 class="h3 fw-bold mt-3 mb-1">Homie</h1>
        <p class="text-muted mb-0">Manajemen Rumah Tangga · Keuangan, Belanja &amp; Agenda</p>
      </div>
      <form id="login-form" novalidate>
        <label class="form-label fw-semibold">Siapa yang masuk?</label>
        <div id="login-users" class="login-users mb-3"></div>
        <label for="login-pin" class="form-label fw-semibold">PIN</label>
        <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8"
          class="form-control form-control-lg text-center pin-input" placeholder="••••" required>
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" id="login-submit">Masuk</button>
        <p class="small text-muted text-center mt-3 mb-0" id="login-hint"></p>
      </form>
    </div>
  </section>

  <!-- Aplikasi -->
  <div id="app" class="app-shell" hidden>
    <aside class="sidebar" aria-label="Menu utama">
      <a class="sidebar-brand" href="#/dashboard">
        <div class="brand-logo"><i class="bi bi-house-heart-fill"></i></div>
        <div>
          <div class="fw-bold lh-sm fs-5">Homie</div>
          <div class="small text-muted">Manajemen Rumah Tangga</div>
        </div>
      </a>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer" id="sidebar-user"></div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2 min-w-0">
          <div class="brand-logo brand-logo-sm d-lg-none"><i class="bi bi-house-heart-fill"></i></div>
          <div class="min-w-0">
            <div class="topbar-title" id="page-title">Homie</div>
            <div class="topbar-subtitle d-none d-lg-block" id="page-subtitle"></div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge rounded-pill text-bg-warning" id="demo-badge" hidden title="Data tidak tersimpan">Mode Demo</span>
          <button class="btn btn-icon" id="theme-toggle" type="button" aria-label="Ganti tema"><i class="bi bi-moon-stars"></i></button>
          <div class="dropdown">
            <button class="btn btn-icon avatar-btn" id="user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu pengguna"></button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" id="user-dropdown"></ul>
          </div>
        </div>
      </header>
      <div id="offline-banner" class="status-banner banner-offline" hidden>
        <i class="bi bi-wifi-off me-2"></i>Anda sedang offline. Data tidak dapat dimuat atau disimpan.
      </div>
      <div id="demo-banner" class="status-banner banner-demo" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi bawah"></nav>
    <button class="fab" id="fab" type="button" aria-label="Tambah data" hidden><i class="bi bi-plus-lg"></i></button>
  </div>

  <div id="toast-container" class="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
